name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The scanner imports only src/mask.js, which has no dependencies.
      - run: node tools/scan-secrets.mjs
      # One version in package.json, server.json, the add-on and the Dockerfiles; server.json limits.
      - run: node tools/check-release.mjs

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The server processes the tests spawn preload test/fixtures/no-network.mjs
      # (fetch throws); the live smoke test is skipped without CHEAP_EYES_LIVE=1.
      - run: npm test
