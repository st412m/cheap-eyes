name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The scanner imports only src/mask.js, which has no dependencies.
      - run: node tools/scan-secrets.mjs
      # check-release reads the tool list from src/tools.js, which needs the dependencies.
      - run: npm ci --omit=optional
      # One version in package.json, server.json, manifest.json, the add-on, the
      # Dockerfiles and compose.example.yaml; server.json limits; the manifest's tools
      # and icon.
      - run: node tools/check-release.mjs
      # The Claude Desktop extension manifest; the CLI version is pinned in
      # tools/pack-mcpb.mjs.
      - name: MCPB manifest
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The server processes the tests spawn preload test/fixtures/no-network.mjs
      # (fetch throws); the live smoke test is skipped without CHEAP_EYES_LIVE=1.
      - run: npm test
