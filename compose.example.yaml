# cheap-eyes over Streamable HTTP in Docker. Copy to compose.yaml and adjust.
#
# The OpenRouter key goes into a .env file next to this one (git-ignored):
#   CHEAP_EYES_OPENROUTER_KEY=<OPENROUTER_KEY>
# Use a key with its own spending limit (openrouter.ai → Keys).
#
# The HTTP token is generated on the first start, kept in the data volume and shown
# once in the log; show it again with
#   docker compose exec cheap-eyes cheap-eyes token
# No settings file is needed: the models are picked on the first job and pinned in the
# data volume, the folders are the mounts under /input.
services:
  cheap-eyes:
    image: ghcr.io/st412m/cheap-eyes:0.3.0
    restart: unless-stopped
    env_file: .env
    environment:
      # The most cheap-eyes spends per day (UTC), in USD; "off" switches the local cap off.
      CHEAP_EYES_DAILY_BUDGET_USD: "1"
      # Only where OpenRouter refuses your network:
      # HTTPS_PROXY: http://proxy.example.com:3128
      # NODE_USE_ENV_PROXY: "1"
    ports:
      # Loopback only: put a TLS reverse proxy in front for remote clients.
      - "127.0.0.1:3400:3400"
    volumes:
      # The token, the results, the usage log and the pinned models: keep it across updates.
      - data:/data
      # The folders cheap-eyes may read, read-only, each under /input.
      - /srv/notes:/input/notes:ro
      - /var/log/myapp:/input/logs:ro

volumes:
  data:
